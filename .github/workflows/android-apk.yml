name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [app.js, index.html, style.css, firebase-config.js, icons/**, native/**, .github/workflows/android-apk.yml]
  pull_request:
    paths: [app.js, index.html, style.css, firebase-config.js, icons/**, native/**, .github/workflows/android-apk.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
      - run: npm run sync
      - name: Build debug APK
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hesap-makinesi-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk

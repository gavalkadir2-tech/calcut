name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [app.js, index.html, style.css, firebase-config.js, icons/**, native/**, .github/workflows/android-apk.yml]
  pull_request:
    paths: [app.js, index.html, style.css, firebase-config.js, icons/**, native/**, .github/workflows/android-apk.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
      - run: npm run sync
      - name: Build debug APK
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hesap-makinesi-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
      # A stable link the phone can open directly (no GitHub login or zip):
      # https://github.com/gavalkadir2-tech/calcut/releases/download/android-test/hesap-makinesi.apk
      - name: Publish to the android-test release
        if: github.event_name != 'pull_request'
        working-directory: native/android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk hesap-makinesi.apk
          gh release view android-test >/dev/null 2>&1 || gh release create android-test \
            --prerelease --title "Android deneme sürümü" \
            --notes "main dalının son hali. Yeni sürümü kurmadan önce eskisini kaldır."
          gh release upload android-test hesap-makinesi.apk --clobber

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hesap Makinesi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="calculator-view" class="screen">
  <div class="calc-display">
    <div id="calc-expression" class="calc-expression"></div>
    <div id="calc-result" class="calc-result">0</div>
  </div>
  <div class="calc-grid">
    <button class="btn fn" data-action="clear">AC</button>
    <button class="btn fn" data-action="sign">+/-</button>
    <button class="btn fn" data-action="percent">%</button>
    <button class="btn op" data-op="/">÷</button>

    <button class="btn num" data-num="7">7</button>
    <button class="btn num" data-num="8">8</button>
    <button class="btn num" data-num="9">9</button>
    <button class="btn op" data-op="*">×</button>

    <button class="btn num" data-num="4">4</button>
    <button class="btn num" data-num="5">5</button>
    <button class="btn num" data-num="6">6</button>
    <button class="btn op" data-op="-">−</button>

    <button class="btn num" data-num="1">1</button>
    <button class="btn num" data-num="2">2</button>
    <button class="btn num" data-num="3">3</button>
    <button class="btn op" data-op="+">+</button>

    <button class="btn num zero" data-num="0">0</button>
    <button class="btn num" data-num=".">.</button>
    <button class="btn eq" data-action="equals">=</button>
  </div>
</div>

<div id="vault-view" class="screen hidden">
  <div id="vault-lock" class="vault-panel">
    <h2>Kilidi Aç</h2>
    <p>Devam etmek için PIN girin</p>
    <input id="vault-pin-input" type="password" inputmode="numeric" maxlength="12" placeholder="PIN">
    <button id="vault-unlock-btn">Aç</button>
    <button id="vault-back-btn" class="ghost">Geri</button>
    <p id="vault-error" class="error"></p>
    <p class="forgot-link" id="forgot-pin-link">PIN'i unuttum</p>
  </div>

  <div id="auth-panel" class="vault-panel hidden">
    <h2 id="auth-title">Giriş Yap</h2>
    <p>Gerçek mesajlaşma hesabınla giriş yap</p>
    <input id="auth-nickname-input" type="text" placeholder="Kullanıcı adı (rumuz)" autocomplete="nickname" class="hidden">
    <input id="auth-email-input" type="email" placeholder="E-posta" autocomplete="username">
    <input id="auth-password-input" type="password" placeholder="Parola" autocomplete="current-password">
    <button id="auth-submit-btn">Giriş Yap</button>
    <button id="auth-toggle-btn" class="ghost">Hesabın yok mu? Kayıt ol</button>
    <button id="auth-back-btn" class="ghost">Geri</button>
    <p id="auth-error" class="error"></p>
  </div>

  <div id="vault-app" class="vault-panel hidden">
    <div id="thread-list-panel">
      <div class="vault-header">
        <h2>Gizli Mesajlar</h2>
        <div class="header-actions">
          <button id="new-thread-btn" title="Yeni sohbet">+</button>
          <button id="settings-btn" title="Ayarlar">⚙</button>
          <button id="lock-btn" title="Kilitle">🔒</button>
        </div>
      </div>
      <ul id="thread-list"></ul>
    </div>

    <div id="thread-detail-panel" class="hidden">
      <div class="vault-header">
        <button id="thread-back-btn" class="ghost">←</button>
        <h2 id="thread-title">Sohbet</h2>
        <button id="thread-delete-btn" title="Sohbeti sil">🗑</button>
      </div>
      <div id="message-list"></div>
      <div class="message-input-row">
        <button id="attach-photo-btn" title="Fotoğraf ekle">📎</button>
        <input id="photo-input" type="file" accept="image/*" class="hidden">
        <input id="message-input" type="text" placeholder="Mesaj yaz...">
        <button id="message-send-btn">Gönder</button>
      </div>
    </div>

    <div id="settings-panel" class="hidden">
      <div class="vault-header">
        <button id="settings-back-btn" class="ghost">←</button>
        <h2>Ayarlar</h2>
      </div>
      <div class="settings-body">
        <label>Yeni PIN (bu cihaz için)</label>
        <input id="new-pin-input" type="password" inputmode="numeric" maxlength="12" placeholder="Yeni PIN">
        <button id="change-pin-btn">PIN'i Değiştir</button>
        <p id="settings-msg"></p>
        <hr>
        <label>Ek güvenlik</label>
        <button id="enable-biometric-btn">Biyometrik onay ekle</button>
        <p id="biometric-msg"></p>
        <hr>
        <button id="logout-btn" class="ghost">Hesaptan Çıkış Yap</button>
        <button id="wipe-vault-btn" class="danger">Tüm Yerel Verileri Sil</button>
      </div>
    </div>
  </div>
</div>

<div id="new-thread-modal" class="modal hidden">
  <div class="modal-box">
    <h3>Yeni Sohbet</h3>
    <input id="new-thread-name" type="text" placeholder="Kişinin kullanıcı adı (rumuz)">
    <div class="modal-actions">
      <button id="new-thread-cancel" class="ghost">İptal</button>
      <button id="new-thread-create">Ekle</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
